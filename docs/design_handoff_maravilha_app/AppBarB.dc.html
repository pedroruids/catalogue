<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet"></helmet>
<header style="background:#FFFFFF;border-bottom:1px solid #E3DED3;font-family:'Figtree',sans-serif;color:#14202E">
  <div style="display:flex;align-items:center;gap:8px;padding:10px 16px;max-width:1240px;margin:0 auto;box-sizing:border-box">
    <sc-if value="{{ temVoltar }}" hint-placeholder-val="{{ false }}">
      <button onClick="{{ onVoltar }}" style="display:flex;align-items:center;gap:4px;height:44px;padding:0 10px 0 4px;border:none;background:transparent;color:#1E3A5F;font-family:'Figtree',sans-serif;font-size:15px;font-weight:700;cursor:pointer">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg>
        <span>{{ voltar }}</span>
      </button>
    </sc-if>
    <sc-if value="{{ semVoltar }}" hint-placeholder-val="{{ true }}">
      <div style="display:flex;align-items:center;height:36px;padding:0 8px;border:1px dashed #B9B2A3;border-radius:8px;font-family:'Bricolage Grotesque',sans-serif;font-size:19px;font-weight:600;color:#1E3A5F">Maravilha</div>
    </sc-if>
    <div style="flex:1"></div>
    <sc-if value="{{ mostraSel }}" hint-placeholder-val="{{ true }}">
      <button onClick="{{ onSel }}" aria-label="Selecção" style="display:flex;align-items:center;gap:6px;height:44px;padding:0 12px;border:1px solid #E3DED3;border-radius:999px;background:#FFFFFF;color:#1E3A5F;font-family:'Figtree',sans-serif;font-size:15px;font-weight:700;cursor:pointer">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 7h12l-1 13H7L6 7z"></path><path d="M9 7a3 3 0 0 1 6 0"></path></svg>
        <span>{{ sel }}</span>
      </button>
    </sc-if>
    <sc-if value="{{ precosOn }}" hint-placeholder-val="{{ true }}">
      <button onClick="{{ onPrecos }}" aria-pressed="true" aria-label="Preços visíveis" title="Preços visíveis" style="display:flex;align-items:center;justify-content:center;gap:6px;width:44px;height:44px;padding:0;border:2px solid #C9A227;border-radius:999px;background:#C9A227;color:#14202E;font-family:'Figtree',sans-serif;font-size:15px;font-weight:700;cursor:pointer;white-space:nowrap">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle></svg>
      </button>
    </sc-if>
    <sc-if value="{{ precosOff }}" hint-placeholder-val="{{ false }}">
      <button onClick="{{ onPrecos }}" aria-pressed="false" aria-label="Preços escondidos" title="Preços escondidos" style="display:flex;align-items:center;justify-content:center;gap:6px;width:44px;height:44px;padding:0;border:2px solid #1E3A5F;border-radius:999px;background:#FFFFFF;color:#1E3A5F;font-family:'Figtree',sans-serif;font-size:15px;font-weight:700;cursor:pointer;white-space:nowrap">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3l18 18"></path><path d="M10.6 5.1A10 10 0 0 1 12 5c6.5 0 10 7 10 7a17 17 0 0 1-3.2 4.2"></path><path d="M6.6 6.6A17 17 0 0 0 2 12s3.5 7 10 7a9.7 9.7 0 0 0 5.4-1.6"></path><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"></path></svg>
      </button>
    </sc-if>
  </div>
  <sc-if value="{{ online }}" hint-placeholder-val="{{ true }}">
    <div style="background:#F3EFE6;border-top:1px solid #ECE7DC">
      <div style="display:flex;align-items:center;gap:8px;padding:6px 16px;max-width:1240px;margin:0 auto;box-sizing:border-box;font-size:13px;color:#4F5967">
        <span style="width:8px;height:8px;border-radius:50%;background:#2E6A47;flex-shrink:0"></span>
        <span>{{ sync }}</span>
      </div>
    </div>
  </sc-if>
  <sc-if value="{{ offline }}" hint-placeholder-val="{{ false }}">
    <div style="background:#F6EBC8;border-top:1px solid #E9D891">
      <div style="display:flex;align-items:center;gap:8px;padding:8px 16px;max-width:1240px;margin:0 auto;box-sizing:border-box;font-size:14px;font-weight:600;color:#14202E">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0"><path d="M3 3l18 18"></path><path d="M8.5 16.5a5 5 0 0 1 7 0"></path><path d="M5 12.5a10 10 0 0 1 4-2.3"></path><path d="M15.5 10.4A10 10 0 0 1 19 12.5"></path><path d="M12 20h.01"></path></svg>
        <span>{{ faixa }}</span>
      </div>
    </div>
  </sc-if>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:360,&quot;height&quot;:110},&quot;precos&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;offline&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;sel&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:2,&quot;tsType&quot;:&quot;number&quot;},&quot;voltar&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;semToggle&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;faixa&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;sync&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;onPrecos&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;},&quot;onSel&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;},&quot;onVoltar&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const t = !p.semToggle;
    return {
      temVoltar: !!p.voltar, semVoltar: !p.voltar, voltar: p.voltar, onVoltar: p.onVoltar,
      mostraSel: p.sel != null, sel: p.sel, onSel: p.onSel,
      precosOn: t && !!p.precos, precosOff: t && !p.precos, onPrecos: p.onPrecos,
      online: !p.offline, offline: !!p.offline,
      faixa: p.faixa || 'Sem rede — a ver a cópia de 08/10/2026, 18:40',
      sync: p.sync || 'Ligado · catálogo sincronizado hoje, 09:12'
    };
  }
}
</script>
</body>
</html>
